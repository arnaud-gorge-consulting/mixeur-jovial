name: Moteur LGPL

# Compile le moteur de Mixeur Jovial (FFmpeg + LAME en WebAssembly, sans GPL)
# sur les serveurs de GitHub. Lancement : onglet « Actions » > « Moteur LGPL » > « Run workflow ».
# Résultat : en bas de la page de l'exécution, rubrique « Artifacts ».

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version de ffmpeg.wasm (auto = dernière 0.12)"
        default: "auto"
        required: true

jobs:
  compiler:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        profil: [leger, complet]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compiler le moteur (${{ matrix.profil }})
        run: bash moteur-build/build.sh ${{ matrix.profil }} ${{ inputs.version }}
      - name: Vérifier le moteur dans un vrai navigateur
        run: |
          set -o pipefail
          cp -r moteur-build/_sortie/${{ matrix.profil }}/moteur app/moteur
          pip install --quiet playwright
          python -m playwright install --with-deps chromium > /dev/null
          python moteur-build/verifier.py app | tee moteur-build/_sortie/${{ matrix.profil }}/moteur/VERIFICATION.txt
      - name: Moteur prêt à copier dans app/moteur
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moteur-${{ matrix.profil }}
          path: moteur-build/_sortie/${{ matrix.profil }}/moteur
      - name: Sources exactes (obligation LGPL)
        uses: actions/upload-artifact@v4
        with:
          name: sources-moteur-${{ matrix.profil }}
          path: |
            moteur-build/_sortie/${{ matrix.profil }}/sources-moteur-${{ matrix.profil }}.tar.gz
            moteur-build/_sortie/${{ matrix.profil }}/modifications-ffmpeg.wasm.patch
            moteur-build/_sortie/${{ matrix.profil }}/moteur-config.json

  publier:
    # Paquet prêt à l'emploi (outil + moteur léger vérifié) et sources, publiés dans « Releases »
    needs: compiler
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: art
      - name: Assembler et publier
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          JOUR=$(date +%Y%m%d); TAG="v2-moteur-$JOUR-${{ github.run_number }}"
          mkdir -p paquet/Mixeur-Jovial
          cp -r app/. paquet/Mixeur-Jovial/
          cp -r art/moteur-leger paquet/Mixeur-Jovial/moteur
          cp PRISE-EN-MAIN.md LICENSE THIRD_PARTY_NOTICES.md paquet/Mixeur-Jovial/
          chmod +x "paquet/Mixeur-Jovial/Lancer Mixeur Jovial (Mac).command"
          (cd paquet && zip -qr ../Mixeur-Jovial.zip Mixeur-Jovial)
          mkdir -p m && cp -r art/moteur-complet m/moteur && (cd m && zip -qr ../moteur-complet.zip moteur)
          cp art/sources-moteur-leger/sources-moteur-leger.tar.gz art/sources-moteur-complet/sources-moteur-complet.tar.gz .
          {
            echo "## Mixeur Jovial, prêt à l'emploi"
            echo
            echo "1. Télécharger **Mixeur-Jovial.zip** ci-dessous et le décompresser."
            echo "2. Windows : double-cliquer sur « Lancer Mixeur Jovial.bat ». Mac : clic droit sur « Lancer Mixeur Jovial (Mac).command » > Ouvrir."
            echo
            echo "Mode d'emploi détaillé : PRISE-EN-MAIN.md (inclus dans le paquet)."
            echo
            echo "### Vérification automatique du moteur (Chromium)"
            echo '```'
            cat art/moteur-leger/VERIFICATION.txt
            echo '```'
            echo
            echo "Autres fichiers : moteur-complet.zip (secours, à décompresser dans le dossier de l'outil) ; sources-moteur-*.tar.gz (sources exactes, obligation LGPL)."
          } > notes.md
          gh release create "$TAG" Mixeur-Jovial.zip moteur-complet.zip sources-moteur-leger.tar.gz sources-moteur-complet.tar.gz \
            --repo "${{ github.repository }}" --title "Mixeur Jovial v2 · moteur du $(date +%d/%m/%Y)" --notes-file notes.md --latest
